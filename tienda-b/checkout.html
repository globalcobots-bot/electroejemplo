<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito - ModaEjemplo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial, sans-serif; margin: 0; color: #111; background: #fff; line-height: 1.4; }
.aviso { background: #111; color: #fff; padding: 8px 16px; font-size: 14px; text-align: center; }
header, main, footer { max-width: 960px; margin: 0 auto; padding: 16px; }
nav a { margin-right: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.producto { border: 1px solid #ccc; padding: 12px; border-radius: 6px; }
.precio-antes { text-decoration: line-through; color: #777; }
.precio-ahora { font-size: 22px; font-weight: bold; color: #1d4ed8; }
.urgencia { color: #b00020; font-weight: bold; font-size: 14px; }
.badge { background: #1d4ed8; color: #fff; padding: 2px 6px; font-size: 12px; border-radius: 3px; }
.fila { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; }
</style>
</head>
<body>
<div class="aviso">SITIO FICTICIO creado para formación. Ningún producto, precio ni empresa es real.</div>
<main>
<p><a href="index.html">&larr; Volver</a></p>
<h1>Tu carrito</h1>

<div class="fila"><span>Chaqueta ligera Brisa</span><span>59,00 €</span></div>
<div class="fila"><span>Envío estándar</span><span>3,95 €</span></div>

<form action="#" method="post">
<p><label><input type="checkbox" name="garantia_extra" checked> Añadir garantía extendida a 5 años (12,90 €)</label></p>
<p><label><input type="checkbox" name="newsletter"> Quiero recibir novedades por correo</label></p>
<p><label><input type="checkbox" name="condiciones"> He leído las <a href="condiciones.html">condiciones de venta</a></label></p>
<div class="fila"><strong>Total</strong><strong>75,85 €</strong></div>
<p><button type="submit">Pagar</button></p>
<p><small>Puedes darte de baja de los avisos desde tu cuenta en cualquier momento.</small></p>
</form>
</main>
</body>
</html>
